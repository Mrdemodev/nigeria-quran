name: nigeria_quran
description: A comprehensive Quran app featuring Nigerian and international reciters
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  audio_service: ^0.18.14
  audio_session: ^0.1.21
  provider: ^6.1.2
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  in_app_review: ^2.0.9
  google_mobile_ads: ^5.1.0
  firebase_core: ^3.13.0
  firebase_remote_config: ^5.4.0
  intl: ^0.19.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/surahs.json
    - assets/data/quran_arabic.json
    - assets/data/quran_english.json
    - assets/data/quran_hausa.json
    - assets/data/quran_yoruba.json
    - google_fonts/
